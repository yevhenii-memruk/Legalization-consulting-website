[project]
name = "legalization-consulting"
version = "0.1.0"
description = "Website for Non-Stop Documents legalization consulting services"
readme = "README.md"
authors = [
    { name = "yevhenii-memruk", email = "yevhenii.memruk@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "google-api-python-client>=2.201.0",
    "jinja2>=3.1.6",
    "phonenumberslite>=9.0.41",
    "pydantic-settings>=2.12.0",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
    "ruff>=0.16.6",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
