{% if seo.canonical_url %}
    <meta name="robots" content="index,follow">
    <link rel="canonical" href="{{ seo.canonical_url }}">
    {% for alternate in seo.alternate_urls %}
    <link rel="alternate" hreflang="{{ alternate.language }}" href="{{ alternate.url }}">
    {% endfor %}
    <link rel="alternate" hreflang="x-default" href="{{ seo.alternate_urls[0].url }}">
{% else %}
    <meta name="robots" content="noindex,nofollow">
{% endif %}
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ company_name }}">
    <meta property="og:title" content="{{ seo_title }}">
    <meta property="og:description" content="{{ seo_description }}">
    <meta property="og:locale" content="{{ seo.locale }}">
{% for locale in seo.alternate_locales %}
    <meta property="og:locale:alternate" content="{{ locale }}">
{% endfor %}
{% if seo.canonical_url %}
    <meta property="og:url" content="{{ seo.canonical_url }}">
{% endif %}
{% if seo.image_url %}
    <meta property="og:image" content="{{ seo.image_url }}">
    <meta property="og:image:alt" content="Non-Stop Documents — {{ seo_description }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ seo_title }}">
    <meta name="twitter:description" content="{{ seo_description }}">
    <meta name="twitter:image" content="{{ seo.image_url }}">
{% else %}
    <meta name="twitter:card" content="summary">
{% endif %}
